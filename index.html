<script>
/* ---------- Safe storage ---------- */
const mem={};
const st={get(k){try{const v=localStorage.getItem(k);return v===null?(mem[k]??null):v}catch(e){return mem[k]??null}},
set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
let S={};
try{S=JSON.parse(st.get('wb_state')||'null')||{}}catch(e){S={}}
S=Object.assign({xp:0,streak:0,last:'',mist:[],key:'',corr:0,qz:0,perf:0,bc:0,cleared:0,badges:[]},S);
const save=()=>st.set('wb_state',JSON.stringify(S));
const $=id=>document.getElementById(id);
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dkey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const L='কখগঘ';
const PROXY='/api/gemini'; // GitHub Pages-এ দিলে এখানে পুরো Vercel লিংক বসান, যেমন https://আপনার-অ্যাপ.vercel.app/api/gemini
const GURL='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';
function callG(body){
  return S.key?fetch(GURL,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.key},body:JSON.stringify(body)})
              :fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
}

/* ---------- Data ---------- */
const Q=(q,o,a,e)=>({q,o,a,e});
const CH=[
{id:'h',sub:'ইতিহাস',t:'ফরাসি বিপ্লব',cls:'নবম শ্রেণি',ic:'landmark',qs:[
Q('ফরাসি বিপ্লব কোন সালে শুরু হয়?',['১৭৭৬','১৭৮৯','১৭৯৯','১৮১৫'],1,'১৭৮৯ খ্রিস্টাব্দের ১৪ জুলাই বাস্তিল দুর্গের পতনের মধ্য দিয়ে ফরাসি বিপ্লব শুরু হয়।'),
Q('বিপ্লবের সময় ফ্রান্সের রাজা কে ছিলেন?',['চতুর্দশ লুই','পঞ্চদশ লুই','ষোড়শ লুই','প্রথম নেপোলিয়ন'],2,'বিপ্লবের সময় ফ্রান্সের সিংহাসনে ছিলেন বুর্বঁ বংশের রাজা ষোড়শ লুই।'),
Q('ফরাসি বিপ্লবের মূল স্লোগান কী ছিল?',['রুটি ও শান্তি','জয় ও গৌরব','স্বাধীনতা, সাম্য ও মৈত্রী','কর্তব্য ও ন্যায়'],2,'স্বাধীনতা, সাম্য ও মৈত্রী – এই তিনটি আদর্শ ফরাসি বিপ্লবের মূল মন্ত্র ছিল।'),
Q('‘দ্য স্পিরিট অব ল’ গ্রন্থের লেখক কে?',['রুশো','ভলতেয়ার','মন্তেস্কু','দিদেরো'],2,'মন্তেস্কু এই গ্রন্থে ক্ষমতা স্বতন্ত্রীকরণের নীতি ব্যাখ্যা করেছেন।'),
Q('‘সোশ্যাল কন্ট্রাক্ট’ গ্রন্থের রচয়িতা কে?',['ভলতেয়ার','রুশো','মন্তেস্কু','টার্গো'],1,'জাঁ জাক রুশো তাঁর এই গ্রন্থে জনগণের সার্বভৌমত্বের কথা বলেছেন।'),
Q('বিপ্লবের আগে ফ্রান্সের পুরোনো সমাজ ও শাসনব্যবস্থা কী নামে পরিচিত?',['আঁসিয়াঁ রেজিম','ডিরেক্টরি','কনসুলেট','জ্যাকোবিন শাসন'],0,'বিপ্লবপূর্ব ফ্রান্সের সামন্ততান্ত্রিক ও স্বৈরতান্ত্রিক ব্যবস্থাকে আঁসিয়াঁ রেজিম বলা হয়।'),
Q('ষোড়শ লুইয়ের স্ত্রীর নাম কী?',['জোসেফিন','মারি অঁতোয়ানেৎ','ক্যাথরিন','এলিজাবেথ'],1,'অস্ট্রিয়ার রাজকন্যা মারি অঁতোয়ানেৎ ছিলেন ষোড়শ লুইয়ের স্ত্রী।'),
Q('বিপ্লবের আগে করের বোঝা সবচেয়ে বেশি কারা বহন করত?',['যাজক সম্প্রদায়','অভিজাত সম্প্রদায়','তৃতীয় এস্টেট (সাধারণ জনগণ)','রাজপরিবার'],2,'প্রথম ও দ্বিতীয় এস্টেট কর থেকে অব্যাহতি পেত; সাধারণ মানুষ নিয়ে গঠিত তৃতীয় এস্টেটই কর দিত।')]},
{id:'b',sub:'জীবন বিজ্ঞান',t:'কোষ ও কলা',cls:'নবম শ্রেণি',ic:'microscope',qs:[
Q('কোষ কে আবিষ্কার করেন?',['রবার্ট হুক','শ্লাইডেন','ভির্শো','লিউয়েনহুক'],0,'১৬৬৫ সালে রবার্ট হুক কর্কের পাতলা ছেদ পর্যবেক্ষণ করে কোষ আবিষ্কার করেন।'),
Q('কোষের শক্তিঘর কোনটি?',['রাইবোজোম','মাইটোকন্ড্রিয়া','গলগি বস্তু','লাইসোজোম'],1,'মাইটোকন্ড্রিয়ায় শ্বসনের মাধ্যমে ATP উৎপন্ন হয়, তাই একে শক্তিঘর বলে।'),
Q('উদ্ভিদকোষের কোষপ্রাচীর মূলত কোন পদার্থ দিয়ে তৈরি?',['কাইটিন','সেলুলোজ','কেরাটিন','গ্লাইকোজেন'],1,'উদ্ভিদকোষের প্রাচীর প্রধানত সেলুলোজ দিয়ে গঠিত।'),
Q('কোষে প্রোটিন সংশ্লেষ ঘটে কোথায়?',['লাইসোজোম','রাইবোজোম','সেন্ট্রিওল','ভ্যাকুওল'],1,'রাইবোজোমকে প্রোটিন তৈরির কারখানা বলা হয়।'),
Q('কোষের ‘আত্মঘাতী থলি’ কাকে বলে?',['গলগি বস্তু','মাইটোকন্ড্রিয়া','লাইসোজোম','নিউক্লিয়াস'],2,'লাইসোজোমের পাচক উৎসেচক কোষকে নষ্ট করতে পারে, তাই একে আত্মঘাতী থলি বলে।'),
Q('সালোকসংশ্লেষ ঘটে কোন অঙ্গাণুতে?',['ক্লোরোপ্লাস্ট','মাইটোকন্ড্রিয়া','নিউক্লিয়াস','গলগি বস্তু'],0,'ক্লোরোপ্লাস্টের ক্লোরোফিল সূর্যালোক শোষণ করে খাদ্য তৈরিতে সাহায্য করে।'),
Q('রক্ত কোন ধরনের কলা?',['আবরণী কলা','যোজক কলা','পেশি কলা','স্নায়ু কলা'],1,'রক্ত একটি তরল যোজক কলা।'),
Q('কোষের নিয়ন্ত্রণকেন্দ্র কোনটি?',['নিউক্লিয়াস','প্লাস্টিড','কোষপ্রাচীর','ভ্যাকুওল'],0,'নিউক্লিয়াস কোষের সমস্ত কাজ নিয়ন্ত্রণ করে এবং এতে বংশগতির বাহক DNA থাকে।')]}
];
const DEMO_TEXT='কোষ জীবদেহের গঠন ও কার্যের একক। রবার্ট হুক ১৬৬৫ সালে কোষ আবিষ্কার করেন। মাইটোকন্ড্রিয়া কোষের শক্তিঘর। রাইবোজোমে প্রোটিন সংশ্লেষ হয়। ক্লোরোপ্লাস্টে সালোকসংশ্লেষ ঘটে।';
const DEMO_SH=[['কোষ কাকে বলে?','জীবদেহের গঠন ও কার্যের একককে কোষ বলে।'],['কোষের শক্তিঘর কাকে বলে?','মাইটোকন্ড্রিয়াকে কোষের শক্তিঘর বলে।'],['ক্লোরোপ্লাস্টের কাজ কী?','ক্লোরোপ্লাস্ট সালোকসংশ্লেষে সাহায্য করে।'],['কলা কাকে বলে?','একই উৎপত্তি, গঠন ও কাজবিশিষ্ট কোষের সমষ্টিকে কলা বলে।'],['রাইবোজোমের কাজ কী?','রাইবোজোম প্রোটিন সংশ্লেষ করে।']].map(x=>({q:x[0],ans:x[1]}));

/* ---------- State ---------- */
let tab='home',Z={iv:0},CUR=null,G=null,busy=false,IMG=null;
let F={sch:'আপনার স্কুল / কোচিং-এর নাম',cls:'নবম শ্রেণি',sub:'',fm:'',tm:'১ ঘণ্টা',ans:false};

/* ---------- Game: level, badges, toast ---------- */
const LV=['নবিশ','শিক্ষার্থী','পড়ুয়া','মেধাবী','পণ্ডিত','বিদ্বান','জ্ঞানী','মহাজ্ঞানী'];
const lvl=()=>Math.floor(S.xp/100)+1;
const lvName=()=>LV[Math.min(lvl()-1,LV.length-1)];
const BD=[
['first','🌱','প্রথম পদক্ষেপ','প্রথম কুইজ শেষ করুন',()=>S.qz>=1],
['c5','🔥','কম্বো মাস্টার','টানা ৫টি সঠিক উত্তর দিন',()=>S.bc>=5],
['perf','💯','নিখুঁত স্কোর','একটিও ভুল ছাড়া কুইজ শেষ করুন',()=>S.perf>=1],
['a50','🎯','৫০ সঠিক','মোট ৫০টি সঠিক উত্তর দিন',()=>S.corr>=50],
['s3','📅','৩ দিনের স্ট্রিক','টানা ৩ দিন পড়ুন',()=>S.streak>=3],
['fix','🛠️','ভুল সংশোধক','১০টি দুর্বল প্রশ্ন ঠিক করুন',()=>S.cleared>=10],
['l5','👑','লেভেল ৫','লেভেল ৫-এ পৌঁছান',()=>lvl()>=5]];
function toast(m){const n=document.querySelectorAll('.tt').length,d=document.createElement('div');
  d.className='tt noprint fixed left-1/2 z-50 bg-slate-900 text-white px-4 py-2 rounded-full text-sm font-semibold shadow-lg';
  d.style.cssText='transform:translateX(-50%);top:'+(64+n*46)+'px';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function addXP(n){const o=lvl();S.xp+=n;if(lvl()>o)toast('🎉 লেভেল '+bn(lvl())+' – '+lvName()+'!')}
function chk(){BD.forEach(b=>{if(!S.badges.includes(b[0])&&b[4]()){S.badges.push(b[0]);toast(b[1]+' নতুন ব্যাজ: '+b[2])}})}
function bar(){$('xp').textContent=bn(S.xp);$('st').textContent=bn(S.streak);$('lv').textContent='Lv '+bn(lvl())}
function touch(){const t=dkey(new Date());if(S.last===t)return;
  S.streak=S.last===dkey(new Date(Date.now()-864e5))?S.streak+1:1;S.last=t}
function addM(q){if(!S.mist.some(m=>m.q===q.q))S.mist.push({q:q.q,o:q.o,a:q.a,e:q.e})}
function nav(t){clearInterval(Z.iv);tab=t;r()}
function setCur(t,items,sub){CUR={t,items};F.sub=sub||t;F.fm=bn(items.length)}

/* ---------- Render ---------- */
function r(){
  const tabs=[['home','house','হোম'],['gen','sparkles','এআই'],['mist','repeat','দুর্বল প্রশ্ন'],['paper','file-text','প্রশ্নপত্র'],['badge','trophy','ব্যাজ']];
  $('nav').innerHTML=tabs.map(t=>`<button class="nv ${tab===t[0]?'on':''}" onclick="nav('${t[0]}')"><i data-lucide="${t[1]}" class="w-6 h-6"></i>${t[2]}${t[0]==='mist'&&S.mist.length?`<span class="absolute top-1 right-[22%] bg-rose-500 text-white rounded-full text-[10px] px-1.5">${bn(S.mist.length)}</span>`:''}</button>`).join('');
  ({home:vHome,gen:vGen,mist:vMist,paper:vPaper,badge:vBadge}[tab]||(()=>{}))();
  bar();try{lucide.createIcons()}catch(e){}
  if(tab==='paper')pb();
}

function vHome(){

/* ---------- Photo upload & compression ---------- */
function compress(f){return new Promise((ok,no)=>{
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{try{
    let w=im.naturalWidth,h=im.naturalHeight;if(!w||!h)throw new Error('img');
    const k=Math.min(1,1200/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    const url=c.toDataURL('image/jpeg',0.8);URL.revokeObjectURL(u);
    ok({url,b64:url.split(',')[1]});
  }catch(e){URL.revokeObjectURL(u);no(e)}};
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('img'))};
  im.src=u;
})}

    if(IMG)parts.push({inlineData:{mimeType:'image/jpeg',data:IMG.b64}});
    try{
      const res=await callG({systemInstruction:{parts:[{text:sys}]},contents:[{parts}],generationConfig:{responseMimeType:'application/json',temperature:0.3}});
      if(!res.ok){let m='';try{m=((await res.json()).error||{}).message||''}catch(_){}
        throw new Error(/API key/i.test(m)||res.status===401||res.status===403?'key':res.status===404||res.status===405?'noproxy':res.status===429?'quota':res.status===400&&IMG?'badimg':'http')}
      const d=await res.json();
      let t=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').replace(/```json|```/g,'').trim();
      let a=JSON.parse(t);
      if(a&&a.error)throw new Error('unreadable');
      a=Array.isArray(a)?a:a.questions;
      items=(a||[]).filter(x=>x&&x.q&&(ty==='mcq'?Array.isArray(x.o)&&x.o.length>=2&&Number.isInteger(x.a)&&x.o[x.a]!==undefined:x.ans)).slice(0,n);
      if(!items.length)throw new Error(IMG?'unreadable':'empty');
      gm('✅ প্রশ্ন তৈরি হয়েছে!','emerald');
    }catch(e){
      busy=false;
      const E={key:'❌ API Key সঠিক নয় বা অনুমতি নেই। কী পরীক্ষা করুন।',quota:'❌ বিনামূল্যের সীমা শেষ বা অনেক বেশি অনুরোধ হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।',unreadable:'❌ ছবিটি ঝাপসা বা পড়া যাচ্ছে না। ভালো আলোয়, সোজা করে, লেখা পরিষ্কার দেখা যায় এমন ছবি তুলে আবার দিন।',badimg:'❌ ছবিটি পাঠানো যায়নি। অন্য একটি ছবি দিয়ে চেষ্টা করুন।',empty:'❌ এআই সঠিক ফরম্যাটে উত্তর দেয়নি। আবার চেষ্টা করুন।',noproxy:'❌ এই সাইটে সার্ভারের এআই চালু নেই। নিচের ঘরে নিজের Gemini API Key দিন।'};
      return gm(E[e.message]||(e.name==='SyntaxError'?E.empty:'❌ সংযোগ বা সার্ভারে সমস্যা হয়েছে। ইন্টারনেট দেখে আবার চেষ্টা করুন।'));
    }
    busy=false;
  }
  G={t:'এআই জেনারেটেড প্রশ্ন',items};setCur(G.t,items,'');showG();
}
function showG(){
  const el=$('gr');if(!el||!G)return;const mcq=G.items[0].o;
  el.innerHTML=`<div class="card"><h3 class="font-bold mb-2">তৈরি প্রশ্ন (${bn(G.items.length)}টি)</h3>
  ${G.items.map((x,i)=>`<div class="mb-3 pb-3 border-b"><div class="font-semibold">${bn(i+1)}. ${esc(x.q)}</div>${x.o?x.o.map((o,j)=>`<div class="text-sm ${j===x.a?'text-emerald-700 font-bold':'text-slate-600'}">${L[j]||j+1}) ${esc(o)}</div>`).join(''):`<div class="text-sm text-emerald-700">উত্তর: ${esc(x.ans)}</div>`}</div>`).join('')}
  <div class="grid gap-2">${mcq?`<button class="btn" onclick="quiz(G.t,G.items,false)">এই প্রশ্নে কুইজ দিন</button>`:''}<button class="btn l" onclick="nav('paper')">প্রশ্নপত্র বানান / প্রিন্ট</button></div></div>`;
}

/* ---------- Question paper ---------- */
function vPaper(){
  if(!CUR){$('app').innerHTML=`<div class="card text-center py-8"><div class="text-5xl">📄</div><h2 class="font-bold text-lg mt-2">প্রশ্নপত্র বানাতে একটি অধ্যায় বেছে নিন</h2>
  <div class="grid gap-2 mt-4">${CH.map((c,i)=>`<button class="btn l" onclick="goPaper(${i})">${c.sub}: ${c.t}</button>`).join('')}</div></div>`;return}
  $('app').innerHTML=`<div class="card noprint"><h2 class="font-bold text-lg mb-2">📄 প্রশ্নপত্র সেটিংস</h2>
  <div class="grid gap-2">
  <input class="inp" value="${esc(F.sch)}" oninput="F.sch=this.value;pb()" placeholder="স্কুল / কোচিং-এর নাম">
  <div class="grid grid-cols-2 gap-2"><input class="inp" value="${esc(F.cls)}" oninput="F.cls=this.value;pb()" placeholder="শ্রেণি"><input class="inp" value="${esc(F.sub)}" oninput="F.sub=this.value;pb()" placeholder="বিষয়"><input class="inp" value="${esc(F.fm)}" oninput="F.fm=this.value;pb()" placeholder="পূর্ণমান"><input class="inp" value="${esc(F.tm)}" oninput="F.tm=this.value;pb()" placeholder="সময়"></div>
  <label class="flex items-center gap-2 font-semibold py-2"><input type="checkbox" class="w-5 h-5" ${F.ans?'checked':''} onchange="F.ans=this.checked;pb()"> উত্তরপত্র দেখান / লুকান</label>
  <button class="btn g" onclick="window.print()">🖨️ PDF ডাউনলোড / প্রিন্ট</button><p class="text-xs text-slate-500">প্রিন্ট ডায়ালগে “PDF হিসেবে সংরক্ষণ করুন” বেছে নিন।</p></div></div><div id="paper"></div>`;
}
function pb(){
  const e=$('paper');if(!e||!CUR)return;const it=CUR.items;
  e.innerHTML=`<div class="text-center border-b-2 border-slate-800 pb-2 mb-3"><div class="text-xl font-bold">${esc(F.sch)}</div><div class="font-semibold">${esc(F.cls)} • ${esc(F.sub)}${F.ans?' • <u>উত্তরপত্র</u>':''}</div>
  <div class="flex justify-between text-sm mt-1"><span>সময়: ${esc(F.tm)}</span><span>পূর্ণমান: ${esc(F.fm)}</span></div></div>
  <div class="text-sm font-semibold mb-2">সকল প্রশ্নের উত্তর দাও। প্রতিটি প্রশ্নের মান ১।</div>
  ${it.map((x,i)=>`<div class="mb-3" style="break-inside:avoid"><div class="font-semibold">${bn(i+1)}. ${esc(x.q)}</div>
  ${x.o?`<div class="grid grid-cols-2 gap-x-4 pl-5 text-sm">${x.o.map((o,j)=>`<div class="${F.ans&&j===x.a?'font-bold underline':''}">(${L[j]||j+1}) ${esc(o)}</div>`).join('')}</div>${F.ans?`<div class="pl-5 text-sm font-semibold">উত্তর: (${L[x.a]}) ${esc(x.o[x.a])}</div>`:''}`:(F.ans?`<div class="pl-5 text-sm font-semibold">উত্তর: ${esc(x.ans)}</div>`:'<div class="h-6 border-b border-dotted border-slate-400 ml-5"></div>')}</div>`).join('')}`;
}

r();
</script>
